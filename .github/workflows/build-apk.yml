name: Build Android APK

# Runs automatically whenever you push to main, and can also be
# triggered manually from the Actions tab in GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build APK with official Buildozer Docker image
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cameraapp-debug-apk
          path: bin/*.apk
